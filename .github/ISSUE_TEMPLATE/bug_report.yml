name: Bug report
description: Something broke or a job was filtered wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. .venv/bin/python -m collector run --dry-run
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: From `logs/collector.log` or the terminal. Remove your email address and anything private first.
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source involved
      multiple: true
      options: [LinkedIn, Indeed, Glassdoor, Greenhouse, Lever, Ashby, Email, Settings page, Scheduler, Not sure]
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.1"
